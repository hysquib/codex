<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8eff8">
  <meta name="description" content="hysquib 的 NFC 数字名片。轻轻一碰，认识一下。">
  <title>hysquib · NFC 名片</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;color:#17233a;background:#e8eff8}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100svh;background:radial-gradient(circle at 16% 12%,#ffcee0 0,transparent 33%),radial-gradient(circle at 84% 18%,#c7d4ff 0,transparent 34%),radial-gradient(circle at 65% 85%,#b7f3ed 0,transparent 39%),#e8eff8;background-attachment:fixed}
    button,a{font:inherit}
    button{cursor:pointer}
    .page{position:relative;width:min(100% - 28px,900px);margin:clamp(14px,4vw,44px) auto;padding:clamp(22px,5vw,48px);border:1px solid #ffffffbd;border-radius:34px;background:linear-gradient(135deg,#ffffffbf,#ffffff72 48%,#ffffff9c);box-shadow:0 24px 75px #44608a2a,inset 0 1px 0 #fff,inset 0 -1px 0 #ffffff8a;-webkit-backdrop-filter:blur(36px) saturate(180%);backdrop-filter:blur(36px) saturate(180%);overflow:hidden}
    .page:before{content:"";position:absolute;inset:0 0 auto 0;height:55%;background:linear-gradient(160deg,#ffffff8a,transparent 55%);pointer-events:none}
    .masthead{position:relative;display:flex;justify-content:space-between;align-items:center;padding-bottom:19px;border-bottom:1px solid #ffffffb8;font-size:12px;font-weight:750;letter-spacing:.09em}
    .masthead span:last-child{font-weight:500;letter-spacing:.02em;color:#61718a}
    .hero{position:relative;display:grid;grid-template-columns:1fr 160px;gap:20px;padding:58px 0 43px;border-bottom:1px solid #ffffffb8}
    .kicker{display:flex;align-items:center;gap:10px;margin:0 0 20px;color:#4267b2;font-size:12px;font-weight:700;letter-spacing:.12em}
    .kicker:before{content:"";width:20px;height:2px;background:#6d91dc}
    h1{margin:0;font-size:clamp(70px,15vw,144px);font-weight:800;letter-spacing:-.105em;line-height:.87;color:#18263e}
    h1 span{color:#517be3}
    .subtitle{margin:26px 0 0;font-size:clamp(20px,3.5vw,29px);font-weight:650;letter-spacing:-.04em;color:#27364f}
    .stamp{position:relative;align-self:center;width:150px;height:150px;border:1px solid #fff;border-radius:38px;color:#537be0;transform:rotate(9deg);background:linear-gradient(145deg,#ffffffc9,#ffffff55);box-shadow:0 18px 30px #586ab337,inset 0 2px 2px #fff,inset 0 -1px 1px #ffffff9c;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
    .stamp:before{content:"";position:absolute;inset:10px;border:1px solid #ffffffb5;border-radius:29px}
    .stamp:after{content:"";position:absolute;top:7px;left:15px;right:15px;height:38%;border-radius:50%;background:linear-gradient(#ffffff9c,transparent);filter:blur(6px)}
    .stamp-inner{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-size:55px;font-weight:750;line-height:1}
    .stamp-inner small{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;margin-top:5px}
    .content{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:42px 0 38px}
    .section-label{margin:0 0 22px;color:#5978ad;font-size:12px;font-weight:750;letter-spacing:.14em}
    .intro{margin:0;max-width:26ch;font-size:clamp(21px,3vw,28px);font-weight:600;line-height:1.55;letter-spacing:-.035em}
    .footnote{margin:28px 0 0;font-size:14px;color:#62728a}
    .links{display:grid;gap:10px}
    .item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:66px;padding:12px 18px;border:1px solid #fff;border-radius:20px;background:linear-gradient(125deg,#ffffff80,#ffffff45);color:#20324f;text-align:left;text-decoration:none;box-shadow:0 6px 18px #6d83ab1c,inset 0 1px 0 #fff;transition:transform .18s,box-shadow .18s,background .18s}
    .item:hover{transform:translateY(-2px);box-shadow:0 10px 24px #6d83ab31;background:#ffffffa0}
    .item:active{transform:scale(.985)}
    .item:focus-visible{outline:3px solid #4f82e9;outline-offset:3px}
    .item strong{font-size:17px;font-weight:700}.item small{display:block;margin-top:3px;color:#67778e;font-size:12px}
    .arrow{font-size:23px;font-weight:400;line-height:1;color:#5b80cf}
    .item.featured{background:linear-gradient(125deg,#d9e9ff88,#ffffff5c)}
    .footer{position:relative;display:flex;justify-content:space-between;gap:15px;padding-top:18px;border-top:1px solid #ffffffb8;color:#697992;font-size:11px;letter-spacing:.07em}
    @media(max-width:680px){
      .hero{grid-template-columns:1fr;padding:48px 0 34px}
      .stamp{position:absolute;right:5px;top:25px;width:68px;height:68px;border-radius:19px}
      .stamp:before{inset:5px;border-radius:14px}.stamp-inner{font-size:27px}.stamp-inner small{font-size:4px;margin-top:1px}
      h1{font-size:clamp(61px,15vw,100px)}
      .content{grid-template-columns:1fr;gap:38px;padding:35px 0}
      .intro{max-width:34ch}.footnote{margin-top:17px}
    }
    @media(max-width:370px){h1{font-size:59px}.stamp{opacity:.7}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item{transition:none}}
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead"><span>HYSQUIB®</span><span>HELLO FROM AN NFC CARD ↗</span></header>
    <section class="hero" aria-labelledby="name">
      <div>
        <p class="kicker">轻轻一碰，认识一下</p>
        <h1 id="name">hy<span>s</span>quib.</h1>
        <p class="subtitle">一个喜欢探索新想法的人。</p>
      </div>
      <div class="stamp" aria-hidden="true"><div class="stamp-inner">H<small>LET'S CONNECT</small></div></div>
    </section>
    <div class="content">
      <section aria-labelledby="about-label">
        <h2 class="section-label" id="about-label">01 / 关于我</h2>
        <p class="intro">你好，我是 hysquib。很高兴通过这张小卡片与你相遇。喜欢有趣的人，也喜欢有意思的对话。</p>
        <p class="footnote">A small card, a new connection.</p>
      </section>
      <section aria-labelledby="links-label">
        <h2 class="section-label" id="links-label">02 / 找到我</h2>
        <nav class="links" aria-label="联系链接">
          <button class="item featured" id="qq" type="button"><span><strong>QQ · 3596521659</strong><small>点击复制号码</small></span><span class="arrow" aria-hidden="true">↗</span></button>
          <a class="item" href="https://blog.hysquib.cn/"><span><strong>Blog</strong><small>看看我的文章</small></span><span class="arrow" aria-hidden="true">↗</span></a>
          <a class="item" href="https://github.com/hysquib"><span><strong>GitHub</strong><small>看看我的项目</small></span><span class="arrow" aria-hidden="true">↗</span></a>
          <button class="item" id="share" type="button"><span><strong>分享这张名片</strong><small>把这次相遇传给朋友</small></span><span class="arrow" aria-hidden="true">↗</span></button>
        </nav>
      </section>
    </div>
    <footer class="footer"><span>© HYSQUIB</span><span>很高兴与你相遇 ✳</span></footer>
  </main>
  <script>
    const qqButton=document.querySelector('#qq');
    const shareButton=document.querySelector('#share');
    const qqHint=qqButton.querySelector('small');
    const shareHint=shareButton.querySelector('small');
    function flash(element,message,original){
      element.textContent=message;
      setTimeout(()=>{element.textContent=original},2500);
    }
    qqButton.addEventListener('click',async()=>{
      try{
        await navigator.clipboard.writeText('3596521659');
        flash(qqHint,'已复制到剪贴板','点击复制号码');
      }catch{window.prompt('复制 QQ 号码','3596521659')}
    });
    shareButton.addEventListener('click',async()=>{
      try{
        if(navigator.share) await navigator.share({title:'hysquib · NFC 名片',url:location.href});
        else if(navigator.clipboard&&window.isSecureContext){
          await navigator.clipboard.writeText(location.href);
          flash(shareHint,'链接已复制','把这次相遇传给朋友');
        }else window.prompt('复制名片链接',location.href);
      }catch(error){if(error.name!=='AbortError') window.prompt('复制名片链接',location.href)}
    });
  </script>
</body>
</html>
